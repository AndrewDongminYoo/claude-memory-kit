# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.23.4
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    # oxlint's autofix and prettier's formatting disagree on scripts/**/*.ts,
    # producing an infinite "check loop aborted after 10 iterations" failure.
    # This repo's established formatter is prettier (see CLAUDE.md); oxlint was
    # never part of its chosen toolchain, just newly auto-enabled by the v1.11.0
    # plugin bundle's default JS/TS detection.
    - oxlint
    - grype
  enabled:
    - actionlint@1.7.12
    - checkov@3.4.0
    - git-diff-check
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - pinact@4.1.1!:
        commands: [lint, upgrade]
    - prettier@3.9.10
    - trivy@0.76.1
    - trufflehog@3.99.7
    - yamllint@1.38.0
  definitions:
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
    - name: trufflehog
      commands:
        - name: lint
          run: trufflehog filesystem --json --fail --no-verification --no-update ${target}
          direct_configs:
            - .trunk/configs/trufflehog_to_sarif.py
          parser:
            runtime: python
            run: python3 .trunk/configs/trufflehog_to_sarif.py
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
tools:
  enabled:
    - oxfmt@0.75.0
